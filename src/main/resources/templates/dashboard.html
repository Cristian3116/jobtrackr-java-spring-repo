<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard | JobTrackr</title>
    <div th:replace="~{fragments :: header_links}"></div>
</head>
<body class="bg-light">

<div th:replace="~{fragments :: navbar}"></div>

<div class="container mt-5">
    <div class="row">
        <div class="col-12">
            <h1 class="mb-4">Welcome, <span th:text="${#authentication.name}">User</span>!</h1>
        </div>
    </div>

    <div class="row text-center">
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <h3>Total Jobs</h3>
                    <p class="display-4 text-primary" th:text="${totalJobs}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-warning">
                    <h3>Pending</h3>
                    <p class="display-4" th:text="${pendingJobs}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm mb-4">
                <div class="card-body text-success">
                    <h3>Interviews</h3>
                    <p class="display-4" th:text="${interviewJobs}">0</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
