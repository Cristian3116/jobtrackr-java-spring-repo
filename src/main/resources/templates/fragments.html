<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header_links">
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom { background-color: #083893; }
        footer { background: #f8f9fa; padding: 20px 0; margin-top: 50px; }
    </style>
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container">
        <a class="navbar-brand" href="/dashboard">JobTrackr</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="/jobs">My Jobs</a></li>
            </ul>
            <span class="navbar-text me-3" th:if="${#authentication.name != 'anonymousUser'}">
                    Hello, <span th:text="${#authentication.name}">User</span>
                </span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-light btn-sm" type="submit">Logout</button>
            </form>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="text-center border-top">
    <div class="container">
        <span class="text-muted">© 2026 JobTrackr - Manage your career professionally.</span>
    </div>
</footer>

</body>
</html>
